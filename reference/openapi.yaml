                      $ref: '#/components/schemas/Invoice'
                  cursor:
                    $ref: '#/components/schemas/Pagination'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
        - Self-Billed Invoices
      summary: Create a UAE Self-Billed Invoice
      description: >-
        Creates a new PINT-AE compliant self-billed e-invoice and submits it to
        the Peppol network.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invoice_type_code
                - issue_date
                - document_currency_code
                - supplier_id
                - items
                - payments
              properties:
                trader_invoice_number:
                  type: string
                  description: >-
                    An invoice number assigned by the buyer to uniquely identify
                    the self-billed invoice in their system
                  example: ACME-SBI-2024-0042
                transaction_types:
                  type: array
                  description: The list of applicable PINT-AE transaction types
                  items:
                    type: string
                    enum:
                      - FREE_TRADE_ZONE
                      - DEEMED_SUPPLY
                      - PROFIT_MARGIN_SCHEME
                      - SUMMARY_INVOICE
                      - CONTINUOUS_SUPPLY
                      - AGENT_BILLING
                      - SUPPLY_THROUGH_ECOMMERCE
                      - EXPORTS
                  example:
                    - CONTINUOUS_SUPPLY
                invoice_type_code:
                  type: string
                  description: >-
                    The UN/CEFACT document type code. See `GET
                    /resources/invoice-types` for available values.
                  example: '389'
                issue_date:
                  type: string
                  format: date
                  description: >-
                    The date on which the self-billed invoice was issued
                    (YYYY-MM-DD). Must not be in the future and must not be more
                    than 30 days in the past.
                  example: '2026-07-14'
                issue_time:
                  type: string
                  description: The invoice issue time (HH:MM:SS)
                  example: '10:00:00'
                due_date:
                  type: string
                  format: date
                  description: The payment due date (YYYY-MM-DD)
                  example: '2026-08-13'
                document_currency_code:
                  type: string
                  description: >-
                    A code that specifies the currency in which the invoice is
                    issued. See `GET /resources/currencies` for available
                    values.
                  example: AED
                tax_currency_exchange_rate:
                  type: number
                  format: double
                  description: >-
                    The exchange rate between document and tax currencies.
                    Required and must be > 0 when `document_currency_code` is
                    not `AED`. When `document_currency_code` is `AED`, must be
                    `1` or omitted. Maximum 6 decimal places.
                  example: 1
                supplier_id:
                  type: string
                  description: >-
                    The DigiTax supplier ID of the supplier from whom the buyer
                    is self-billing
                  example: supplier_01HC3J1VVVM05YCTS61G7V3KC6
                payee_party_id:
                  type: string
                  description: >-
                    The DigiTax party ID of the payee if different from the
                    supplier
                  example: party_01HC3J1VVVM05YCTS61G7V3KC6
                tax_representative_party_id:
                  type: string
                  description: The DigiTax party ID of the seller's tax representative
                  example: party_01HC3J1VVVM05YCTS61G7V3KC6
                tax_point_date:
                  type: string
                  format: date
                  description: >-
                    The VAT point date (YYYY-MM-DD). Must be strictly before the
                    issue_date.
                  example: '2026-07-13'
                buyer_reference:
                  type: string
                  description: >-
                    An identifier assigned by the buyer used for internal
                    routing purposes
                  example: BR-2026-00789
                accounting_cost:
                  type: string
                  description: >-
                    A textual value that specifies where to book the relevant
                    data into the buyer's financial accounts
                  example: CAPEX-2024-Q4
                project_reference:
                  type: string
                  description: A project reference
                  example: PROJ-JEBEL-2024
                note:
                  type: string
                  description: A free-text note on the self-billed invoice
                  example: Self-billed invoice details
                invoice_period:
                  $ref: '#/components/schemas/InvoicePeriod'
                order_reference:
                  $ref: '#/components/schemas/OrderReference'
                billing_reference:
                  type: array
                  description: References to preceding invoices
                  items:
                    $ref: '#/components/schemas/DocumentReference'
                despatch_document_reference:
                  $ref: '#/components/schemas/DocumentReference'
                receipt_document_reference:
                  $ref: '#/components/schemas/DocumentReference'
                originator_document_reference:
                  $ref: '#/components/schemas/DocumentReference'
                contract_document_reference:
                  $ref: '#/components/schemas/DocumentReference'
                additional_documents:
                  type: array
                  description: Additional supporting document references
                  items:
                    $ref: '#/components/schemas/DocumentReference'
                delivery:
                  $ref: '#/components/schemas/InvoiceDelivery'
                payment_terms_note:
                  type: string
                  description: Textual payment terms
                  example: Next 30 days
                allowance_charges:
                  type: array
                  description: Invoice-level allowances and charges
                  items:
                    $ref: '#/components/schemas/InvoiceAllowanceCharge'
                payments:
                  type: array
                  description: Payment details for this self-billed invoice
                  items:
                    $ref: '#/components/schemas/CreateInvoicePaymentRequest'
                items:
                  type: array
                  description: The self-billed invoice line items
                  items:
                    $ref: '#/components/schemas/CreateInvoiceItemRequest'
                prepaid_amount:
                  type: number
                  format: double
                  description: >-
                    The amount already paid, to be deducted from the payable
                    amount
                  example: 0
                payable_rounding_amount:
                  type: number
                  format: double
                  description: The rounding amount
                  example: 0
                beneficiary_tax_number:
                  type: string
                  description: >-
                    The TRN or TIN of the beneficiary for Free Trade Zone
                    supplies. Required when `transaction_types` includes
                    `FREE_TRADE_ZONE`.
                  example: '123456789098703'
                principle_trn:
                  type: string
                  description: >-
                    The TRN of the principal for Disclosed Agent billing.
                    Required when `transaction_types` includes `AGENT_BILLING`.
                    Must differ from the business's own TRN.
                  example: '123456789098703'
            examples:
              standard_self_billed_invoice:
                description: >-
                  Full-featured self-billed invoice (type 389) issued by the
                  buyer; includes order reference, originator reference, a
                  billing reference to a prior invoice, and document- and
                  line-level allowances/charges
                summary: Standard Self-Billed Invoice
                value:
                  accounting_cost: Regular sales
                  additional_documents:
                    - id: PO-AE-220
                    - id: PO-AE-220
                  allowance_charges:
                    - amount: 262.15
                      base_amount: 10486
                      charge_indicator: false
                      multiplier_rate: 0.025
                      reason: Special Rebate
                      reason_code: '100'
                      tax_category_code: S
                      tax_rate: 0.05
                    - amount: 419.44
                      base_amount: 10486
                      charge_indicator: true
                      multiplier_rate: 0.04
                      reason: Rush Delivery
                      reason_code: AAT
                      tax_category_code: S
                      tax_rate: 0.05
                  billing_reference:
                    - id: INV-234-2025
                      issue_date: '2026-08-27'
                  buyer_reference: PO-AE-220
                  despatch_document_reference:
                    id: Memo-1000
                  document_currency_code: AED
                  due_date: '2026-09-03'
                  invoice_period:
                    end_date: '2026-08-27'
                    start_date: '2026-08-21'
                  invoice_type_code: '389'
                  issue_date: '2026-08-27'
                  issue_time: '07:54:00'
                  items:
                    - allowance_charges:
                        - amount: 294
                          base_amount: 9800
                          charge_indicator: false
                          multiplier_rate: 0.03
                          reason: Discount
                          reason_code: '95'
                        - amount: 980
                          base_amount: 9800
                          charge_indicator: true
                          multiplier_rate: 0.1
                          reason: Technical Modification
                          reason_code: AAC
                      buyers_item_id: Purchase goods
                      gross_price: 5
                      item_id: item_01HFXK2VV2M05YCTS61G7SVCS1
                      note: All items
                      price_amount: 4.9
                      price_discount: 0.1
                      quantity: 2000
                      sellers_item_id: Sales Goods
                      tax_category_code: S
                      tax_rate: 0.05
                      unit_of_measure_code: H87
                  note: Self Billing Tax invoice
                  order_reference:
                    purchase_order_id: PO-AE-220
                    sales_order_id: Salesorder-2122
                  originator_document_reference:
                    id: PO-AE-220
                  payable_rounding_amount: 0.05
                  payment_terms_note: Within a week
                  payments:
                    - card_holder_name: Card Holder Name
                      card_network_id: VISA
                      card_primary_account_number: XXXXXXXXXXXX1234
                      payment_means_code: '55'
                  project_reference: Regular work
                  supplier_id: supplier_01HC3J1VVVM05YCTS61G7V3KC6
                  tax_point_date: '2026-08-20'
                  trader_invoice_number: AE-01-SB-TEST
              standard_self_billed_invoice_minimal:
                description: >-
                  Minimal valid self-billed invoice containing only the required
                  fields; useful as a starting point for integration
                summary: Standard Self-Billed Invoice — Mandatory Fields Only
                value:
                  document_currency_code: AED
                  due_date: '2026-09-26'
                  invoice_type_code: '389'
                  issue_date: '2026-08-27'
                  items:
                    - item_id: item_01HFXK2VV2M05YCTS61G7SVCS1
                      price_amount: 500
                      quantity: 1
                      tax_category_code: S
                      tax_rate: 0.05
                      unit_of_measure_code: EA
                  payments:
                    - payee_account_id: AE070331234567890123456
                      payee_account_name: ACME Trading LLC
                      payment_means_code: '30'
                  supplier_id: supplier_01HC3J1VVVM05YCTS61G7V3KC6
                  trader_invoice_number: ACME-SBI-2026-0002
      responses:
        '201':
          description: Self-billed invoice created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        default:
          $ref: '#/components/responses/Error'
