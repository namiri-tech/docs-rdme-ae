      description: Retrieves information about an invoice given its ID on DigiTax
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: invoice_id
          required: true
          schema:
            type: string
            description: Invoice ID on DigiTax
            example: invoice_01KMFSMEYVCDV0150T6P4WECVR
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        default:
          $ref: '#/components/responses/Error'
  /credit-notes:
    get:
      tags:
        - Credit Notes
      summary: Get UAE Credit Notes
      description: Returns a paginated list of all credit notes created by the business
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A list of credit notes
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
                  cursor:
                    $ref: '#/components/schemas/Pagination'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
        - Credit Notes
      summary: Create a UAE Credit Note
      description: Creates a new PINT-AE compliant credit note
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - credit_note_reason_code
                - credit_note_reason
                - issue_date
                - document_currency_code
                - customer_party_id
                - invoice_type_code
                - items
              properties:
                trader_invoice_number:
                  type: string
                  description: >-
                    An invoice number assigned by the supplier to uniquely
                    identify the invoice in their system
                  example: ACME-CN-2024-0003
                credit_note_reason_code:
                  type: string
                  description: >-
                    The coded reason for the credit note. See `GET
                    /resources/credit-reasons` for available values.
                  example: DL8.61.1.A
                credit_note_reason:
                  type: string
                  description: The textual reason for the credit note
                  example: Supply was cancelled
                original_invoice_id:
                  type: string
                  description: >-
                    The DigiTax ID of the original invoice this credit note
                    relates to
                  example: invoice_01KMFSMEYVCDV0150T6P4WECVR
                invoice_type_code:
                  type: string
                  description: >-
                    The UN/CEFACT document type code. If the credit note
                    references an original invoice, the value should correspond
                    to the original invoice type code (e.g. "381" for a standard
                    credit note referencing a "380" invoice). See `GET
                    /resources/invoice-types` for available values.
                  example: '381'
                issue_date:
                  type: string
                  format: date
                  description: >-
                    The date on which the credit note was issued (YYYY-MM-DD).
                    Must not be in the future and must not be more than 30 days
                    in the past.
                  example: '2026-07-14'
                issue_time:
                  type: string
                  description: The credit note issue time (HH:MM:SS)
                  example: '09:00:00'
                due_date:
                  type: string
                  format: date
                  description: The payment due date (YYYY-MM-DD)
                  example: '2026-08-13'
                document_currency_code:
                  type: string
                  description: >-
                    The currency code (ISO 4217). See `GET
                    /resources/currencies` for available values.
                  example: AED
                tax_currency_exchange_rate:
                  type: number
                  format: double
                  description: >-
                    The exchange rate between document and tax currencies.
                    Required and must be > 0 when `document_currency_code` is
                    not `AED`. When `document_currency_code` is `AED`, must be
                    `1` or omitted. Maximum 6 decimal places.
                  example: 1
                customer_party_id:
                  type: string
                  description: The DigiTax party ID of the buyer
                  example: party_01HC3J1VVVM05YCTS61G7V3KC6
                payee_party_id:
                  type: string
                  description: The DigiTax party ID of the payee (if different from buyer)
                  example: party_01HC3J1VVVM05YCTS61G7V3KC6
                tax_representative_party_id:
                  type: string
                  description: The DigiTax party ID of the seller's tax representative
                  example: party_01HC3J1VVVM05YCTS61G7V3KC6
                buyer_reference:
                  type: string
                  description: >-
                    An identifier assigned by the Buyer used for internal
                    routing purposes
                  example: BR-2024-00789
                accounting_cost:
                  type: string
                  description: >-
                    A textual value that specifies where to book the relevant
                    data into the Buyer's financial accounts
                  example: CAPEX-2024-Q4
                note:
                  type: string
                  description: A free-text note on the credit note
                  example: Credit for cancelled order
                invoice_period:
                  $ref: '#/components/schemas/InvoicePeriod'
                order_reference:
                  $ref: '#/components/schemas/OrderReference'
                despatch_document_reference:
                  $ref: '#/components/schemas/DocumentReference'
                receipt_document_reference:
                  $ref: '#/components/schemas/DocumentReference'
                originator_document_reference:
                  $ref: '#/components/schemas/DocumentReference'
                contract_document_reference:
                  $ref: '#/components/schemas/DocumentReference'
                additional_documents:
                  type: array
                  description: Additional supporting document references
                  items:
                    $ref: '#/components/schemas/DocumentReference'
                delivery:
                  $ref: '#/components/schemas/InvoiceDelivery'
                payment_terms_note:
                  type: string
                  description: Textual payment terms
                  example: Next 30 days
                allowance_charges:
                  type: array
                  description: Invoice-level allowances and charges
                  items:
                    $ref: '#/components/schemas/InvoiceAllowanceCharge'
                payments:
                  type: array
                  description: Payment means for this credit note
                  items:
                    $ref: '#/components/schemas/CreateInvoicePaymentRequest'
                items:
                  type: array
                  description: The credit note line items
                  items:
                    $ref: '#/components/schemas/CreateInvoiceItemRequest'
                prepaid_amount:
                  type: number
                  format: double
                  description: The amount already paid
                  example: 0
                payable_rounding_amount:
                  type: number
                  format: double
                  description: The rounding amount
                  example: 0
                transaction_types:
                  type: array
                  description: The list of applicable PINT-AE transaction types
                  items:
                    type: string
                    enum:
                      - FREE_TRADE_ZONE
                      - DEEMED_SUPPLY
                      - PROFIT_MARGIN_SCHEME
                      - SUMMARY_INVOICE
                      - CONTINUOUS_SUPPLY
                      - AGENT_BILLING
                      - SUPPLY_THROUGH_ECOMMERCE
                      - EXPORTS
                  example:
                    - EXPORTS
                    - CONTINUOUS_SUPPLY
                beneficiary_tax_number:
                  type: string
                  description: >-
                    The TRN or TIN of the beneficiary for Free Trade Zone
                    supplies. Required when `transaction_types` includes
                    `FREE_TRADE_ZONE`.
                  example: '123456789098703'
                principle_trn:
                  type: string
                  description: >-
                    The TRN of the principal for Disclosed Agent billing.
                    Required when `transaction_types` includes `AGENT_BILLING`.
                    Must differ from the business's own TRN.
                  example: '123456789098703'
